<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>AdoNet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Регистрация</h2>
    <form id="register-form">
        <input name="name" placeholder="Имя" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Пароль" required>
        <button>Зарегистрироваться</button>
    </form>

    <h2>Пользователи</h2>
    <table id="users"></table>

    <h2>Проекты</h2>
    <form id="project-form">
        <select name="userId" id="project-user"></select>
        <input name="address" placeholder="Адрес" required>
        <input name="startDate" type="date" required>
        <input name="budget" type="number" min="0" step="0.01" placeholder="Бюджет" required>
        <button>Добавить</button>
    </form>
    <table id="projects"></table>

    <h2>Этапы</h2>
    <form id="stage-form">
        <select name="projectId" id="stage-project"></select>
        <input name="title" placeholder="Название" required>
        <input name="cost" type="number" min="0" step="0.01" placeholder="Стоимость" required>
        <select name="status">
            <option>Запланирован</option>
            <option>В работе</option>
            <option>Завершён</option>
        </select>
        <button>Добавить</button>
    </form>
    <table id="stages"></table>

    <script src="app.js"></script>
</body>
</html>
